<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e0d8;
    --accent:#b23a2b; --accent-soft:#f3e3df;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  header{padding:48px 20px 24px;max-width:860px;margin:0 auto}
  header .eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-size:clamp(28px,5vw,40px);line-height:1.15;margin:8px 0 12px}
  header p{color:var(--muted);margin:0;max-width:620px}
  nav{max-width:860px;margin:0 auto;padding:0 20px 8px;display:flex;flex-wrap:wrap;gap:8px}
  nav a{font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px}
  nav a:hover{border-color:var(--accent);color:var(--accent)}
  main{max-width:860px;margin:0 auto;padding:12px 20px 48px}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin:16px 0}
  h2{font-size:22px;margin:0 0 6px}
  .lead{color:var(--muted);margin:0 0 18px;font-size:15px}
  label{font-size:14px;font-weight:600;display:block;margin-bottom:4px}
  input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
  input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
  .result{background:var(--accent-soft);border-radius:10px;padding:14px 16px;font-size:15px}
  .result strong{font-size:20px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:13px;color:var(--muted);font-weight:600}
  td .jp{font-size:18px;font-weight:700}
  header a{color:var(--accent)}
  td .rom{display:block;font-size:12px;color:var(--muted)}
  td .en{display:block;font-size:14px;line-height:1.4;margin-top:2px}
  .out{min-width:76px}
  .out .sub{display:block;font-weight:400;font-size:12px;white-space:normal;line-height:1.35;margin-top:2px}
  @media (max-width:480px){ section{padding:18px 14px} th,td{padding:10px 4px} }
  td input{width:88px;min-width:88px;padding:8px 10px;text-align:right}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .out{font-weight:700;white-space:nowrap}
  .note{font-size:13px;color:var(--muted);margin-top:12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
  .seg button{font:inherit;font-size:14px;border:0;background:#fff;padding:8px 14px;cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff}
  ul.tips{padding-left:20px;margin:0}
  ul.tips li{margin:6px 0}
  footer{max-width:860px;margin:0 auto;padding:0 20px 40px;font-size:13px;color:var(--muted)}
  .scroll{overflow-x:auto}

  .drop{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;cursor:pointer;background:#fbfaf7}
  .drop:hover{border-color:var(--accent)}
  #preview{display:none;max-width:100%;border-radius:10px;margin-top:14px;cursor:crosshair;touch-action:manipulation}
  .picked{display:flex;align-items:center;gap:12px;margin:14px 0}
  .sw{width:56px;height:56px;border-radius:10px;border:1px solid var(--line);flex:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
  .card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .card .c{height:72px}
  .card .t{padding:10px 12px;font-size:14px;line-height:1.4}
  .card .t b{display:block;font-size:15px}
  .card a{font-size:13px;color:var(--accent)}
  .group{margin:18px 0 6px;font-size:15px;font-weight:700}
  .group span{font-weight:400;color:var(--muted);font-size:13px;display:block}
  details.lang{display:inline-block;position:relative;font-size:14px;margin-bottom:14px}
  details.lang summary{cursor:pointer;list-style:none;border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px}
  details.lang summary::-webkit-details-marker{display:none}
  details.lang summary::after{content:" ▾";color:var(--muted)}
  details.lang ul{position:absolute;z-index:10;left:0;top:calc(100% + 6px);margin:0;padding:6px 0;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:160px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
  details.lang li a,details.lang li b{display:block;padding:8px 14px;color:var(--ink);text-decoration:none}
  details.lang li a:hover{background:var(--accent-soft)}
</style>
